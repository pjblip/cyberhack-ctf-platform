<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystic Flag Forge 2.0 - Gandhinagar University</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #06b6d4;
            --neon-purple: #a855f7;
            --neon-pink: #ec4899;
            --bg-dark: #020617;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            color: #ffffff;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            cursor: crosshair;
            min-height: 100vh;
            height: 100%;
        }
        
        html {
            height: 100%;
            min-height: 100vh;
        }
        
        #root {
            min-height: 100vh;
            height: 100%;
        }

        /* --- CYBERPUNK MOVING GRID ANIMATION --- */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 200vw;
            height: 200vh;
            background-image: 
                linear-gradient(rgba(6, 182, 212, 0.07) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6, 182, 212, 0.07) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px);
            animation: gridMove 20s linear infinite;
            pointer-events: none;
            z-index: -2;
            opacity: 0.6;
        }

        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0) translateZ(-200px); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(50px) translateZ(-200px); }
        }

        /* --- CRT SCANLINE EFFECTS --- */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9998;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.06) 50%,
                rgba(0,0,0,0.06)
            );
            background-size: 100% 4px;
            animation: scanlineScroll 0.5s linear infinite;
        }

        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            background: radial-gradient(circle at center, transparent 60%, rgba(0,0,0,0.8) 100%);
        }

        /* --- UTILITIES --- */
        button, a, input, select, textarea, [role="button"] {
            cursor: pointer;
        }

        code, pre, .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        ::selection {
            background: var(--neon-pink);
            color: white;
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #020617;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
            border: 2px solid #020617;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--neon-cyan);
        }

        .neon-text {
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.5), 0 0 20px rgba(6, 182, 212, 0.3);
        }
        
        .text-stroke-sm {
            -webkit-text-stroke: 1px rgba(255,255,255,0.1);
        }

        /* SHIMMER EFFECT */
        @keyframes shimmer {
            0% { transform: translateX(-150%) skewX(-12deg); }
            100% { transform: translateX(150%) skewX(-12deg); }
        }
        .animate-shimmer {
            animation: shimmer 2.5s infinite;
        }
        
        /* SCAN EFFECT FOR LOGO */
        @keyframes scan {
            0% { transform: translateY(-100%); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(200%); opacity: 0; }
        }

        /* MARQUEE ANIMATION */
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .animate-marquee {
            animation: marquee 30s linear infinite;
        }
        
        /* GLOW UTILS */
        .shadow-neon {
            box-shadow: 0 0 5px var(--neon-cyan), 0 0 20px rgba(6, 182, 212, 0.3);
        }

        .preserve-3d {
            transform-style: preserve-3d;
        }

        .perspective-1000 {
            perspective: 1000px;
        }
    </style>

{

</head>

</html>
